<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Iridescent gradient sphere">
  <defs>
    <radialGradient id="sphereCore" cx="38%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#f7f5ff"/>
      <stop offset="18%" stop-color="#d8dbff"/>
      <stop offset="42%" stop-color="#9eb8ff"/>
      <stop offset="68%" stop-color="#4a8fb8"/>
      <stop offset="88%" stop-color="#1a6b7a"/>
      <stop offset="100%" stop-color="#0d4a55"/>
    </radialGradient>
    <radialGradient id="sphereSheen" cx="32%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#acafff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphereRim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <circle cx="300" cy="300" r="280" fill="url(#sphereCore)" filter="url(#softBlur)"/>
  <circle cx="300" cy="300" r="280" fill="url(#sphereSheen)"/>
  <circle cx="300" cy="300" r="280" fill="url(#sphereRim)"/>
</svg>
